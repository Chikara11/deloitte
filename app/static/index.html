<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuditBridge — Deloitte × Google Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #000000;
      --white: #FFFFFF;
      --green: #86BC25;
      --green-dark: #26890D;
      --grey-dark: #53565A;
      --grey-mid: #97999B;
      --border: #D0D0CE;
      --bg-soft: #F7F7F7;
      --amber: #ED8B00;
      --red: #DA291C;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Open Sans", Arial, sans-serif;
      background: var(--white);
      color: var(--black);
      font-size: 13px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: var(--black);
      color: var(--white);
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--green);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .wordmark { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; display: flex; align-items: center; gap: 6px; }
    .green-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
    .subtitle { font-size: 12px; color: var(--grey-mid); border-left: 1px solid #333; padding-left: 12px; }
    .header-controls { display: flex; align-items: center; gap: 12px; }
    select, input, textarea {
      font-family: inherit;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      background: var(--white);
      color: var(--black);
    }
    header select { background: #1A1A1A; color: var(--white); border-color: #444; }
    .btn {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--black);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--bg-soft); }
    .btn-primary { background: var(--green); border-color: var(--green); color: var(--white); }
    .btn-primary:hover { background: var(--green-dark); border-color: var(--green-dark); }
    .btn-danger { background: var(--red); border-color: var(--red); color: var(--white); }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 200px 1fr 310px;
      min-height: 0;
    }
    nav.left-nav {
      border-right: 1px solid var(--border);
      padding: 16px 0;
      background: var(--white);
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 10px 20px;
      border: none;
      border-left: 3px solid transparent;
      background: transparent;
      color: var(--grey-dark);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-item:hover { background: var(--bg-soft); color: var(--black); }
    .nav-item.active { border-left-color: var(--green); color: var(--black); background: #F4F9EB; }

    main.content {
      padding: 24px 28px;
      overflow-y: auto;
      background: var(--white);
    }
    aside.trust-panel {
      border-left: 1px solid var(--border);
      background: var(--bg-soft);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .panel-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--grey-dark); margin: 0 0 8px 0; }
    .card { border: 1px solid var(--border); border-radius: 4px; background: var(--white); padding: 16px; margin-bottom: 16px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .badge-green { color: var(--green-dark); background: #EEF6E6; border-color: var(--green); }
    .badge-amber { color: #9A5800; background: #FFF4E5; border-color: var(--amber); }
    .badge-red { color: var(--red); background: #FDECEA; border-color: var(--red); }
    .badge-grey { color: var(--grey-dark); background: var(--bg-soft); border-color: var(--border); }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { font-weight: 700; color: var(--grey-dark); background: var(--bg-soft); font-size: 11px; text-transform: uppercase; }
    tr.selectable { cursor: pointer; }
    tr.selectable:hover { background: #F9FBF5; }
    tr.selected { background: #F1F7E6; }

    /* Evidence Viewer */
    .evidence-split { display: grid; grid-template-columns: 340px 1fr; gap: 16px; min-height: 460px; }
    .evidence-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .ev-item {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      background: var(--white);
    }
    .ev-item:hover, .ev-item.active { border-color: var(--green); background: #F4F9EB; }
    .file-viewer {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--white);
      overflow: auto;
      max-height: 500px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .code-line { display: flex; padding: 2px 10px; border-left: 3px solid transparent; }
    .line-num { width: 38px; color: var(--grey-mid); user-select: none; flex-shrink: 0; }
    .line-highlight {
      background: rgba(134, 188, 37, 0.22);
      border-left: 3px solid var(--red);
      font-weight: 600;
    }
    .cell-highlight {
      background: rgba(134, 188, 37, 0.25) !important;
      border-left: 3px solid var(--red) !important;
      font-weight: 700;
    }

    /* Trust panel metrics */
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric-box { background: var(--white); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; }
    .metric-val { font-size: 16px; font-weight: 700; color: var(--black); }
    .metric-lbl { font-size: 10px; color: var(--grey-dark); text-transform: uppercase; }
    .quarantine-box { border: 1px solid var(--red); background: #FDECEA; border-radius: 4px; padding: 10px; }
    .log-stream { flex: 1; overflow-y: auto; max-height: 280px; display: flex; flex-direction: column; gap: 6px; }
    .log-entry { background: var(--white); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font-size: 11px; }
    .log-entry.block { border-left: 3px solid var(--red); }

    footer {
      background: var(--bg-soft);
      border-top: 1px solid var(--border);
      padding: 8px 24px;
      text-align: center;
      font-size: 11px;
      color: var(--grey-dark);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="wordmark">AuditBridge<span class="green-dot"></span></div>
      <div class="subtitle">Hackathon Deloitte × Google Cloud — Prototype</div>
    </div>
    <div class="header-controls">
      <label style="font-size:11px;color:#97999B;">Client</label>
      <select id="client-select" onchange="onFilterChange()">
        <option value="ALL">Tous les clients</option>
        <option value="CLIENT_A">CLIENT_A — Alpha Distribution (PCG)</option>
        <option value="CLIENT_B">CLIENT_B — Nova Group Europe (IFRS)</option>
      </select>
      <label style="font-size:11px;color:#97999B;">Rôle</label>
      <select id="role-select" onchange="onRoleSelect()">
        <option value="AUDITEUR">Auditeur Financier</option>
        <option value="AVOCAT">Avocat Tax &amp; Legal</option>
        <option value="CONSULTANT">Consultant</option>
      </select>
      <button class="btn btn-sm" onclick="reseedDemo()">Réinitialiser Démo</button>
    </div>
  </header>

  <div class="workspace">
    <nav class="left-nav">
      <button class="nav-item active" id="nav-dossiers" onclick="setTab('dossiers')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        Dossiers
      </button>
      <button class="nav-item" id="nav-analyse" onclick="setTab('analyse')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Analyse
      </button>
      <button class="nav-item" id="nav-preuves" onclick="setTab('preuves')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Preuves
      </button>
      <button class="nav-item" id="nav-experts" onclick="setTab('experts')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Experts
      </button>
      <button class="nav-item" id="nav-validation" onclick="setTab('validation')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Validation
      </button>
      <button class="nav-item" id="nav-fiche" onclick="setTab('fiche')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="13" y2="16"/></svg>
        Fiche de contrôle
      </button>
      <button class="nav-item" id="nav-journal" onclick="setTab('journal')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Journal
      </button>
    </nav>

    <main class="content" id="main-content"></main>

    <aside class="trust-panel">
      <div>
        <h3 class="panel-title">Trust &amp; Governance</h3>
        <div class="metric-grid">
          <div class="metric-box"><div class="metric-val" id="m-tenant">Vérifié</div><div class="metric-lbl">Isolation Tenant</div></div>
          <div class="metric-box"><div class="metric-val" id="m-pii">0</div><div class="metric-lbl">PII Masquées</div></div>
          <div class="metric-box"><div class="metric-val" id="m-armor" style="color:var(--red);">0</div><div class="metric-lbl">Blocs Model Armor</div></div>
          <div class="metric-box"><div class="metric-val" id="m-skeptic">0</div><div class="metric-lbl">Rejets Skeptic</div></div>
        </div>
      </div>

      <div class="card" style="margin-bottom:0;padding:10px;">
        <div class="metric-lbl">Étape Harness ADK</div>
        <div id="m-step" style="font-weight:700;font-size:12px;color:var(--green-dark);margin-top:2px;">IDLE</div>
      </div>

      <div id="quarantine-container"></div>

      <div style="flex:1;display:flex;flex-direction:column;min-height:0;">
        <h3 class="panel-title">Flux d'audit en direct</h3>
        <div id="log-stream" class="log-stream"></div>
      </div>
    </aside>
  </div>

  <footer>Brouillon généré par IA — validation humaine requise — données fictives</footer>

  <script>
    let allCases = [];
    let selectedCaseId = null;
    let activeTab = "dossiers";
    let trustLogs = [];
    let selectedEvidence = null;
    let compareMode = false;
    let expertTabRole = "AVOCAT";

    async function init() {
      await refreshData();
      const sse = new EventSource("/api/logs/stream");
      sse.addEventListener("log", (e) => {
        const evt = JSON.parse(e.data);
        trustLogs.unshift(evt);
        renderTrustPanel();
      });
    }

    async function refreshData() {
      const [cRes, tRes] = await Promise.all([fetch("/api/cases"), fetch("/api/trust")]);
      allCases = await cRes.json();
      const tData = await tRes.json();
      trustLogs = (tData.logs || []).slice().reverse();
      if (!selectedCaseId || !allCases.find(c => c.case_id === selectedCaseId)) {
        const preferred = allCases.find(c => c.status === "Anomalie") || allCases[0];
        selectedCaseId = preferred ? preferred.case_id : null;
      }
      renderTrustMetrics(tData.metrics);
      renderTrustPanel();
      renderMain();
    }

    function renderTrustMetrics(m) {
      document.getElementById("m-tenant").textContent = m.tenant_verified ? "Vérifié" : "Alerte";
      document.getElementById("m-pii").textContent = m.pii_masked_count;
      document.getElementById("m-armor").textContent = m.model_armor_blocks;
      document.getElementById("m-skeptic").textContent = m.skeptic_rejections;
      document.getElementById("m-step").textContent = m.current_harness_step;
    }

    function renderTrustPanel() {
      const qCases = allCases.filter(c => c.status === "Quarantaine");
      const qBox = document.getElementById("quarantine-container");
      qBox.innerHTML = qCases.map(q => `
        <div class="quarantine-box" style="margin-bottom:8px;">
          <div style="font-weight:700;color:var(--red);font-size:12px;">Fichier en Quarantaine</div>
          <div style="font-size:11px;margin:4px 0;">${q.invoice.source_file}</div>
          <button class="btn btn-danger btn-sm" onclick="examineQuarantine('${q.case_id}')">Examiner</button>
        </div>
      `).join("");

      const stream = document.getElementById("log-stream");
      stream.innerHTML = trustLogs.slice(0, 25).map(l => `
        <div class="log-entry ${l.verdict === 'BLOCK' || l.verdict === 'REJECT' ? 'block' : ''}">
          <div style="display:flex;justify-content:space-between;font-weight:700;">
            <span>${l.action}</span>
            <span style="color:var(--grey-dark);">${l.agent}</span>
          </div>
          <div style="color:var(--grey-dark);font-size:10px;">${l.tenant_id} • ${l.verdict}</div>
        </div>
      `).join("");
    }

    function getFilteredCases() {
      const f = document.getElementById("client-select").value;
      return f === "ALL" ? allCases : allCases.filter(c => c.tenant_id === f);
    }

    function getSelectedCase() {
      return allCases.find(c => c.case_id === selectedCaseId) || null;
    }

    function setTab(tab) {
      activeTab = tab;
      document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
      document.getElementById(`nav-${tab}`).classList.add("active");
      renderMain();
    }

    function onFilterChange() {
      const list = getFilteredCases();
      if (list.length && !list.find(c => c.case_id === selectedCaseId)) {
        selectedCaseId = list[0].case_id;
      }
      renderMain();
    }

    function onRoleSelect() {
      const r = document.getElementById("role-select").value;
      if (r === "AVOCAT" || r === "CONSULTANT") {
        expertTabRole = r;
        setTab("experts");
      } else {
        setTab("validation");
      }
    }

    function statusBadge(c) {
      if (c.status === "Quarantaine" || c.status === "Rejeté") return `<span class="badge badge-red">${c.status}</span>`;
      if (c.status === "Anomalie") return `<span class="badge badge-amber">${c.status}</span>`;
      return `<span class="badge badge-green">${c.status}</span>`;
    }

    function scoreBadge(c) {
      const cls = c.score_color === "green" ? "badge-green" : (c.score_color === "amber" ? "badge-amber" : "badge-red");
      return `<span class="badge ${cls}">${c.confidence_score}/100</span>`;
    }

    function renderMain() {
      const el = document.getElementById("main-content");
      if (activeTab === "dossiers") renderDossiers(el);
      else if (activeTab === "analyse") renderAnalyse(el);
      else if (activeTab === "preuves") renderPreuves(el);
      else if (activeTab === "experts") renderExperts(el);
      else if (activeTab === "validation") renderValidation(el);
      else if (activeTab === "fiche") renderFiche(el);
      else if (activeTab === "journal") renderJournal(el);
    }

    function renderDossiers(el) {
      const list = getFilteredCases();
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div>
            <h2 style="margin:0;font-size:18px;">Dossiers de contrôle</h2>
            <p style="margin:2px 0 0;color:var(--grey-dark);">Sélectionnez une facture pour analyser les règles, preuves et validations.</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="file" id="upload-file" accept=".txt,.csv" onchange="uploadFile()" />
          </div>
        </div>
        <div class="card" style="padding:0;">
          <table>
            <thead><tr><th>Facture</th><th>Client</th><th>Fournisseur</th><th>Montant HT</th><th>Statut</th><th>Score</th><th>Dernière action</th></tr></thead>
            <tbody>
              ${list.map(c => `
                <tr class="selectable ${c.case_id === selectedCaseId ? 'selected' : ''}" onclick="selectCase('${c.case_id}')">
                  <td><strong>${c.invoice.invoice_id}</strong><div style="font-size:11px;color:var(--grey-dark);">${c.invoice.source_file}</div></td>
                  <td>${c.tenant_id}</td>
                  <td>${c.invoice.supplier}</td>
                  <td style="font-family:monospace;">${Number(c.invoice.amount_ht).toLocaleString('fr-FR')} €</td>
                  <td>${statusBadge(c)}</td>
                  <td>${scoreBadge(c)}</td>
                  <td style="color:var(--grey-dark);">${c.last_action}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderAnalyse(el) {
      const c = getSelectedCase();
      if (!c) { el.innerHTML = "<p>Aucun dossier sélectionné.</p>"; return; }
      const gaugeColor = c.score_color === "green" ? "var(--green-dark)" : (c.score_color === "amber" ? "var(--amber)" : "var(--red)");
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div>
            <h2 style="margin:0;font-size:18px;">Analyse — ${c.invoice.invoice_id} (${c.tenant_id})</h2>
            <p style="margin:2px 0 0;color:var(--grey-dark);">${c.invoice.supplier} → ${c.invoice.customer} • ${Number(c.invoice.amount_ht).toLocaleString('fr-FR')} € HT</p>
          </div>
          <div style="text-align:right;">
            <div style="font-size:11px;color:var(--grey-dark);text-transform:uppercase;">Score de confiance</div>
            <div style="font-size:24px;font-weight:700;color:${gaugeColor};">${c.confidence_score}/100</div>
          </div>
        </div>
        <div class="card">
          <div class="panel-title">Synthèse de l'Agent Auditeur</div>
          <p style="margin:0 0 8px;">${c.auditor_explanation}</p>
          <div style="padding:10px;background:var(--bg-soft);border-left:3px solid ${gaugeColor};font-weight:600;">Recommandation : ${c.recommendation}</div>
        </div>
        <div class="card" style="padding:0;">
          <table>
            <thead><tr><th>Règle</th><th>Statut</th><th>Preuve résumée</th><th>Action</th></tr></thead>
            <tbody>
              ${c.findings.map(f => `
                <tr>
                  <td><strong>${f.label}</strong><div style="font-size:11px;color:var(--grey-dark);">${f.rule_id}</div></td>
                  <td>${f.passed ? '<span class="badge badge-green">Conforme</span>' : '<span class="badge badge-red">Anomalie</span>'}</td>
                  <td>${f.summary}</td>
                  <td><button class="btn btn-sm" onclick="openFirstEvidence('${f.rule_id}')">Voir preuves (${f.evidences.length})</button></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    async function renderPreuves(el) {
      const c = getSelectedCase();
      if (!c) { el.innerHTML = "<p>Aucun dossier sélectionné.</p>"; return; }
      const allEv = [];
      c.findings.forEach(f => f.evidences.forEach((ev, idx) => allEv.push({ ...ev, rule_id: f.rule_id, passed: f.passed, id: `${f.rule_id}-${idx}` })));
      if (!selectedEvidence && allEv.length) selectedEvidence = allEv[0];

      const groups = {
        input: { title: "Fichier d'entrée", items: allEv.filter(e => e.source_type === "input") },
        passport: { title: "Passeport client", items: allEv.filter(e => e.source_type === "passport") },
        regulation: { title: "Réglementation", items: allEv.filter(e => e.source_type === "regulation") },
      };

      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h2 style="margin:0;font-size:18px;">Preuves &amp; Traçabilité — ${c.invoice.invoice_id}</h2>
          <button class="btn ${compareMode ? 'btn-primary' : ''}" onclick="toggleCompare()">Mode Comparer (Entrée / Règle)</button>
        </div>
        ${compareMode ? `<div id="compare-area" class="evidence-compare"></div>` : `
        <div class="evidence-split">
          <div style="overflow-y:auto;max-height:500px;padding-right:4px;">
            ${Object.values(groups).map(g => `
              <div class="panel-title" style="margin-top:8px;">${g.title} (${g.items.length})</div>
              ${g.items.map(ev => `
                <div class="ev-item ${selectedEvidence && selectedEvidence.id === ev.id ? 'active' : ''}" onclick='pickEvidence(${JSON.stringify(ev).replace(/'/g, "&#39;")})'>
                  <div style="display:flex;justify-content:space-between;font-weight:700;font-size:11px;">
                    <span>${ev.rule_id}</span>
                    <span style="color:var(--grey-dark);">${ev.file.split('/').pop()}</span>
                  </div>
                  <div style="font-size:11px;color:var(--grey-dark);margin-top:3px;">${ev.explanation}</div>
                </div>
              `).join("")}
            `).join("")}
          </div>
          <div>
            <div id="ev-header" style="margin-bottom:8px;font-weight:700;font-size:12px;"></div>
            <div id="file-viewer" class="file-viewer">Sélectionnez une preuve à gauche.</div>
          </div>
        </div>`}
      `;

      if (compareMode) {
        await renderCompareView(allEv);
      } else if (selectedEvidence) {
        await loadEvidenceFile(selectedEvidence, document.getElementById("file-viewer"), document.getElementById("ev-header"));
      }
    }

    async function renderCompareView(allEv) {
      const area = document.getElementById("compare-area");
      const inp = allEv.find(e => e.source_type === "input" && !e.passed) || allEv.find(e => e.source_type === "input");
      const reg = allEv.find(e => e.source_type === "regulation" && !e.passed) || allEv.find(e => e.source_type === "regulation");
      area.innerHTML = `
        <div>
          <div class="panel-title" id="cmp-left-hdr">Fichier d'entrée</div>
          <div class="file-viewer" id="cmp-left"></div>
        </div>
        <div>
          <div class="panel-title" id="cmp-right-hdr">Réglementation</div>
          <div class="file-viewer" id="cmp-right"></div>
        </div>
      `;
      if (inp) await loadEvidenceFile(inp, document.getElementById("cmp-left"), document.getElementById("cmp-left-hdr"));
      if (reg) await loadEvidenceFile(reg, document.getElementById("cmp-right"), document.getElementById("cmp-right-hdr"));
    }

    async function loadEvidenceFile(ev, container, headerEl) {
      headerEl.textContent = `${ev.file} — ${ev.explanation}`;
      const res = await fetch(`/api/files?path=${encodeURIComponent(ev.file)}`);
      if (!res.ok) { container.innerHTML = "<div style='padding:12px;'>Fichier introuvable.</div>"; return; }
      const data = await res.json();

      if (data.kind === "text") {
        const s = ev.locator.line_start || 1;
        const e = ev.locator.line_end || s;
        container.innerHTML = data.lines.map((ln, idx) => {
          const num = idx + 1;
          const hl = num >= s && num <= e;
          return `<div class="code-line ${hl ? 'line-highlight' : ''}" id="hl-${num}" title="${hl ? ev.explanation : ''}"><span class="line-num">${num}</span><span>${escapeHtml(ln)}</span></div>`;
        }).join("");
        const target = container.querySelector(".line-highlight");
        if (target) target.scrollIntoView({ block: "center" });
      } else if (data.kind === "csv") {
        const targetRow = ev.locator.row;
        const targetCol = ev.locator.column;
        const colIdx = data.headers.indexOf(targetCol);
        container.innerHTML = `<table><thead><tr>${data.headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
          data.rows.map((r, rIdx) => {
            const csvRowNum = rIdx + 2;
            return `<tr>${r.map((cell, cIdx) => {
              const hl = csvRowNum === targetRow && (cIdx === colIdx || targetCol === undefined);
              return `<td class="${hl ? 'cell-highlight' : ''}" title="${hl ? ev.explanation : ''}">${escapeHtml(cell)}</td>`;
            }).join("")}</tr>`;
          }).join("") + `</tbody></table>`;
      } else if (data.kind === "json") {
        const key = (ev.locator.json_path || "").replace("$.", "");
        const lines = data.raw.split("\n");
        container.innerHTML = lines.map((ln, idx) => {
          const hl = key && ln.includes(`"${key}"`);
          return `<div class="code-line ${hl ? 'line-highlight' : ''}" title="${hl ? ev.explanation : ''}"><span class="line-num">${idx + 1}</span><span>${escapeHtml(ln)}</span></div>`;
        }).join("");
      }
    }

    function renderExperts(el) {
      const c = getSelectedCase();
      if (!c) { el.innerHTML = "<p>Aucun dossier sélectionné.</p>"; return; }
      const brief = c.micro_briefs.find(b => b.role === expertTabRole);
      const existing = c.expert_responses[expertTabRole];
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h2 style="margin:0;font-size:18px;">Gate 2 — Validation des Experts (${c.invoice.invoice_id})</h2>
          <div style="display:flex;gap:8px;">
            <button class="btn ${expertTabRole === 'AVOCAT' ? 'btn-primary' : ''}" onclick="expertTabRole='AVOCAT';renderMain()">Avocat Tax &amp; Legal</button>
            <button class="btn ${expertTabRole === 'CONSULTANT' ? 'btn-primary' : ''}" onclick="expertTabRole='CONSULTANT';renderMain()">Consultant</button>
          </div>
        </div>
        ${!brief ? `<div class="card">Aucune anomalie sur ce dossier — aucune intervention requise pour ${expertTabRole}.</div>` : `
          <div class="card">
            <div class="panel-title">${brief.title}</div>
            <p>${brief.context_summary}</p>
            <p style="font-weight:700;margin-top:12px;">${brief.question}</p>
            <div style="margin:12px 0;">
              <input id="exp-comment" style="width:100%;" placeholder="Commentaire justificatif de l'expert..." value="${existing ? escapeHtml(existing.comment) : ''}" />
            </div>
            <div style="display:flex;gap:8px;">
              ${brief.options.map(opt => `<button class="btn btn-primary" onclick="submitGate2('${expertTabRole}', '${opt}')">${opt}</button>`).join("")}
            </div>
            ${existing ? `<div style="margin-top:12px;color:var(--green-dark);font-weight:700;">Réponse enregistrée : ${existing.decision} (${existing.timestamp})</div>` : ""}
          </div>
        `}
      `;
    }

    function renderValidation(el) {
      const c = getSelectedCase();
      const tenant = document.getElementById("client-select").value;
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h2 style="margin:0;font-size:18px;">Gate 3 — Validation Auditeur</h2>
          <button class="btn btn-primary" onclick="bulkValidate('${tenant === 'ALL' ? 'CLIENT_A' : tenant}')">Valider en masse les dossiers verts</button>
        </div>
        ${!c ? "<p>Aucun dossier sélectionné.</p>" : `
          <div class="card">
            <div class="panel-title">Décision finale — ${c.invoice.invoice_id}</div>
            <p>Statut actuel : ${statusBadge(c)} • Score : ${scoreBadge(c)}</p>
            <p><strong>Recommandation SynthesisAgent :</strong> ${c.recommendation}</p>
            <div style="display:flex;gap:10px;margin-top:14px;">
              <button class="btn btn-primary" onclick="submitGate3('Valider')">Valider la conclusion</button>
              <button class="btn btn-danger" onclick="submitGate3('Rejeter')">Rejeter / Escalader</button>
            </div>
          </div>
        `}
      `;
    }

    function renderFiche(el) {
      const c = getSelectedCase();
      if (!c) { el.innerHTML = "<p>Aucun dossier sélectionné.</p>"; return; }
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h2 style="margin:0;font-size:18px;">Fiche de contrôle documentée — ${c.invoice.invoice_id}</h2>
          <div style="display:flex;gap:8px;">
            <a class="btn btn-primary" href="/api/cases/${encodeURIComponent(c.case_id)}/export/docx">Exporter .docx</a>
            <a class="btn" href="/api/cases/${encodeURIComponent(c.case_id)}/export/md">Exporter .md</a>
          </div>
        </div>
        <div class="card"><pre style="white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;margin:0;">${escapeHtml(c.control_sheet_md)}</pre></div>
      `;
    }

    function renderJournal(el) {
      el.innerHTML = `
        <h2 style="margin:0 0 14px;font-size:18px;">Journal d'audit structuré (Cloud Logging)</h2>
        <div class="card" style="padding:0;">
          <table>
            <thead><tr><th>Timestamp</th><th>Session</th><th>Tenant</th><th>Acteur</th><th>Action</th><th>Verdict</th></tr></thead>
            <tbody>
              ${trustLogs.map(l => `
                <tr>
                  <td style="font-family:monospace;font-size:11px;">${l.timestamp}</td>
                  <td style="font-family:monospace;font-size:11px;">${l.session_id}</td>
                  <td>${l.tenant_id}</td>
                  <td><strong>${l.agent}</strong></td>
                  <td>${l.action}</td>
                  <td><span class="badge ${l.verdict === 'BLOCK' || l.verdict === 'REJECT' ? 'badge-red' : (l.verdict === 'ANOMALIE' ? 'badge-amber' : 'badge-green')}">${l.verdict}</span></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function selectCase(cid) {
      selectedCaseId = cid;
      selectedEvidence = null;
      renderMain();
    }

    function openFirstEvidence(ruleId) {
      const c = getSelectedCase();
      const f = c.findings.find(x => x.rule_id === ruleId);
      if (f && f.evidences.length) {
        selectedEvidence = { ...f.evidences[0], rule_id: f.rule_id, passed: f.passed, id: `${f.rule_id}-0` };
      }
      compareMode = false;
      setTab("preuves");
    }

    function pickEvidence(ev) {
      selectedEvidence = ev;
      renderMain();
    }

    function toggleCompare() {
      compareMode = !compareMode;
      renderMain();
    }

    async function examineQuarantine(cid) {
      const res = await fetch(`/api/quarantine/${encodeURIComponent(cid)}`);
      const detail = await res.json();
      selectedCaseId = cid;
      selectedEvidence = {
        source_type: "input",
        file: detail.file,
        locator: detail.locator,
        explanation: detail.reason,
        rule_id: "GATE_1",
        passed: false,
        id: "quarantine-0",
      };
      compareMode = false;
      setTab("preuves");
    }

    async function submitGate2(role, decision) {
      const comment = document.getElementById("exp-comment")?.value || "";
      await fetch(`/api/cases/${encodeURIComponent(selectedCaseId)}/gate2`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role, decision, comment, responder: `${role.toLowerCase()}@deloitte.fr` }),
      });
      await refreshData();
    }

    async function submitGate3(decision) {
      await fetch(`/api/cases/${encodeURIComponent(selectedCaseId)}/gate3`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decision, validator: "auditeur.senior@deloitte.fr" }),
      });
      await refreshData();
    }

    async function bulkValidate(tenantId) {
      await fetch(`/api/tenants/${tenantId}/bulk-validate`, { method: "POST" });
      await refreshData();
    }

    async function uploadFile() {
      const inp = document.getElementById("upload-file");
      if (!inp.files.length) return;
      const tenant = document.getElementById("client-select").value;
      const targetTenant = tenant === "ALL" ? "CLIENT_B" : tenant;
      const fd = new FormData();
      fd.append("file", inp.files[0]);
      await fetch(`/api/tenants/${targetTenant}/upload`, { method: "POST", body: fd });
      await refreshData();
    }

    async function reseedDemo() {
      await fetch("/api/seed", { method: "POST" });
      await refreshData();
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    init();
  </script>
</body>
</html>

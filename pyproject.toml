[project]
name = "deloitte-gcp-war-room"
version = "0.1.0"
description = "Zero-Trust M&A Forensic War Room on Google Cloud"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    "google-genai>=1.0.0",
    "google-adk>=0.1.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-bigquery>=3.26.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-dlp>=3.24.0",
    "google-cloud-kms>=3.0.0",
    "google-auth>=2.35.0",
    "pypdf>=5.0.0",
    "reportlab>=4.2.5",
    "numpy>=2.1.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

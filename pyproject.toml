[project]
name = "auditbridge"
version = "1.0.0"
description = "AuditBridge — Governed Multi-Agent Audit Platform (Deloitte x Google Cloud)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    "google-adk>=0.1.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-genai>=1.0.0",
    "google-cloud-modelarmor>=0.2.0",
    "google-cloud-bigquery>=3.26.0",
    "google-cloud-dlp>=3.24.0",
    "google-cloud-logging>=3.11.0",
    "pandas>=2.2.0",
    "python-docx>=1.1.2",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
